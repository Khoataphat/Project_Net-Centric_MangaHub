<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>MangaHub - Đọc truyện</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex flex-col">
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="text-blue-400 hover:text-blue-300 font-bold">← Trở về</a>
            <h1 class="text-xl font-bold">Đang đọc: <span id="mangaTitle" class="text-blue-400">One Piece</span></h1>
        </div>
        <div class="text-sm">Chương hiện tại: <span id="currentChapterDisplay" class="font-bold text-green-400">1</span>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center p-6 gap-6">
        <div class="bg-slate-800 p-8 rounded-lg shadow-2xl w-full max-w-2xl text-center border border-slate-700">
            <h2 class="text-3xl font-bold mb-8">Nội dung chương <span id="chapterNumberText">1</span></h2>
            <div class="flex justify-center gap-8 text-6xl opacity-20 my-12">
                <span class="material-icons">Nội dung ảnh giả lập...</span>
            </div>
        </div>

        <div class="flex gap-4">
            <button id="btnPrev" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 rounded font-bold transition">← Chương
                trước</button>
            <button id="btnNext" class="px-6 py-2 bg-blue-600 hover:bg-blue-500 rounded font-bold transition">Chương
                tiếp →</button>
        </div>
    </main>

    <footer class="bg-black text-green-400 p-4 h-56 overflow-y-auto font-mono text-xs border-t-4 border-blue-600">
        <div class="flex items-center gap-2 mb-2 border-b border-slate-800 pb-1 sticky top-0 bg-black">
            <span class="bg-blue-600 text-white px-2 py-0.5 rounded text-[10px]">TCP STREAM</span>
            <span class="text-slate-500 italic" id="connStatus">Đang chờ kết nối...</span>
        </div>
        <div id="terminalContent" class="space-y-1">
        </div>
    </footer>

    <script src="sync.js"></script>
</body>

</html>
