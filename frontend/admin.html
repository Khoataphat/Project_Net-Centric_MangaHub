<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>MangaHub - System Admin gRPC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-300 min-h-screen p-8 font-mono">
    <div class="max-w-3xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <div class="flex items-center gap-4">
                <span class="bg-purple-600 text-white px-3 py-1 rounded font-bold text-sm">ADMIN PANEL</span>
                <h1 class="text-2xl font-bold text-white">gRPC Data Scanner</h1>
            </div>
            <div class="flex gap-4">
                <a href="dashboard.html" class="text-slate-400 hover:text-white transition text-sm flex items-center gap-1">
                    ← Dashboard
                </a>
                <button onclick="logout()" class="bg-red-900/30 text-red-400 px-3 py-1 rounded border border-red-900/50 hover:bg-red-900/50 transition text-sm">
                    Đăng xuất
                </button>
            </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-lg border border-slate-700 shadow-xl mb-8 flex gap-4">
            <input type="number" id="mangaId" placeholder="Nhập ID truyện (vd: 1, 2, 3)..."
                class="flex-1 bg-slate-900 border border-slate-600 rounded px-4 py-2 text-white focus:outline-none focus:border-purple-500">
            <button onclick="scanManga()"
                class="bg-purple-600 hover:bg-purple-500 text-white px-6 py-2 rounded font-bold transition duration-200 shadow-[0_0_15px_rgba(147,51,234,0.4)]">
                Scan via gRPC
            </button>
        </div>

        <div class="bg-black rounded-lg border border-slate-800 p-4">
            <div class="text-xs text-slate-500 mb-2 flex justify-between border-b border-slate-800 pb-2">
                <span>// gRPC RESPONSE TERMINAL</span>
                <span id="statusIndicator" class="text-green-500">IDLE</span>
            </div>
            <pre id="result"
                class="text-green-400 text-sm overflow-x-auto whitespace-pre-wrap min-h-[200px]">Waiting for query...</pre>
        </div>
    </div>

    <script>
        // Kiểm tra Token
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'auth.html';
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'auth.html';
        }

        async function scanManga() {
            const id = document.getElementById('mangaId').value;
            const resultBox = document.getElementById('result');
            const statusIndicator = document.getElementById('statusIndicator');

            if (!id) {
                resultBox.innerHTML = '<span class="text-red-500">Lỗi: Vui lòng nhập Manga ID</span>';
                return;
            }

            resultBox.innerHTML = '<span class="text-yellow-400">Đang khởi tạo kết nối gRPC qua HTTP Bridge...</span>';
            statusIndicator.innerText = "SCANNING...";
            statusIndicator.className = "text-yellow-500 animate-pulse";

            try {
                // Đảm bảo URL này khớp hoàn toàn với cấu hình trong router.go
                const res = await fetch(`http://localhost:8080/api/admin/scan-manga?id=${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (res.ok) {
                    statusIndicator.innerText = "SUCCESS";
                    statusIndicator.className = "text-green-500";
                    // In JSON ra format đẹp có thụt lề 2 space
                    resultBox.innerText = JSON.stringify(data, null, 2);
                } else {
                    statusIndicator.innerText = "FAILED";
                    statusIndicator.className = "text-red-500";
                    resultBox.innerHTML = `<span class="text-red-500">${JSON.stringify(data, null, 2)}</span>`;
                }
            } catch (err) {
                statusIndicator.innerText = "ERROR";
                statusIndicator.className = "text-red-500";
                resultBox.innerHTML = `<span class="text-red-500">Lỗi mạng: Không thể kết nối tới Server Gin\n${err.message}</span>`;
            }
        }
    </script>
</body>

</html>
